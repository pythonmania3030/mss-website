    <h1>Student Application Form</h1>
    <form>
        <label for="Fullname">
            students Fullname:
        </label>
<input type="text" id="fullname"
name="fullname" required>
<label for="dob">Date of Birth</label>
<input type="date" id="dob"
name="dob">
<label for="gender">Gender</label>
<select id="gender" name="gender">
    <option value=""> Select Gender</option>
        <option value="male">Male</option>
        <option value= "female">Female</option>
<label for="guardian">Parent/Guardian
     Name:</label>
     <input type="text" id="guardian"
     name="guardian">
     <label for="phone"></label>Parent/Guardian
     phone:</label>
     <input type="tel" id="phone"
     name="phone">
     <label for="email"> Parent Gaurdian>
     </label>
     <input type="email" id="email"
     name="email">
     <label for="class"></label>Contact Applying for:</label>
     <select id="class" name="class">
        <option value="">select</option>
        <option value="jss">Junior</option>
        <option value="sss">Senior Secondary</option>
     </select>
     <label for="Address">students Address:</label>
     <textarea id="Address" name="Address"
     rows="4" cols="40"></textarea>
     </label>
     <label for="previous school">Previous School:</label>
     <input type="text" id="previous school"
     name="previous-school">
     <button type="submit">Submit
         Application</button>
    </form>
</body>
