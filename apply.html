<!DOCTYPE html>
<html>
<head>
  <title>Application Form - Bright Future International School</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="programmes.html">Programmes</a>
    <a href="admission.html">Admission</a>
    <a href="contact.html">Contact</a>
  </nav>

  <h1>Student Application Form</h1>
  <form id="Application">
    <label>Student Fullname:</label>
    <input type="text" name="fullname" required><br><br>

    <label>Date of Birth:</label>
    <input type="date" name="dob" required><br><br>

    <label>Gender:</label>
    <select name="gender" required>
      <option value="">Select Gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select><br><br>

    <label>Guardian Name:</label>
    <input type="text" name="guardian" required><br><br>

    <label>Phone:</label>
    <input type="tel" name="phone" required><br><br>

    <label>Email:</label>
    <input type="email" name="email"><br><br>

    <label>Class Applying for:</label>
    <select name="class" required>
      <option value="">Select</option>
      <option value="jss">Junior Secondary</option>
      <option value="sss">Senior Secondary</option>
      <option value="primary">Primary</option>
    </select><br><br>

    <label>Address:</label>
    <textarea name="address"></textarea><br><br>

    <label>Previous School:</label>
    <input type="text" name="previousSchool"><br><br>

    <button type="submit">Submit Application</button>
  </form>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyWSt92Bi_U6icRNnWpqDVcHBWAgcHrt9CH3fbTZ3IZOFROQ0n24t9Xc01jdRVeBlpv/exec";
document.getElementById("Application").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector("button");
  btn.textContent = "Submitting...";
  btn.disabled = true;
  const data = {
    fullName: form.fullname.value,
    dob: form.dob.value,
    gender: form.gender.value,
    guardian: form.guardian.value,
    phone: form.phone.value,
    email: form.email.value,
    class: form.class.value,
    address: form.address.value,
    previousSchool: form.previousSchool.value
  };
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(data)
    });
    alert("Application submitted! Check your Google Sheet.");
    form.reset();
  } catch(err) {
    alert("Failed: " + err.message);
  } finally {
    btn.textContent = "Submit Application";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
